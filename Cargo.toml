[workspace]
members = [
  "crates/bidi",
  "crates/bidi/generate",
  "crates/strip-ansi-escapes",
  "crates/sync-color-schemes",
  "crates/wezterm",
  "crates/wezterm-blob-leases",
  "crates/wezterm-cell",
  "crates/wezterm-escape-parser",
  "crates/wezterm-dynamic",
  "crates/wezterm-gui",
  "crates/wezterm-mux-server",
  "crates/wezterm-open-url",
  "crates/wezterm-surface",
  "crates/wezterm-uds",
  "xtask",
]
resolver = "2"
exclude = [
  "crates/termwiz/codegen",
  "crates/wezterm-char-props/codegen",
]

[profile.release]
opt-level = 3
debug = 2

[profile.dev]
# https://jakedeichert.com/blog/reducing-rust-incremental-compilation-times-on-macos-by-70-percent/
# Disabled because it breaks builds on Windows
#split-debuginfo = "unpacked"

