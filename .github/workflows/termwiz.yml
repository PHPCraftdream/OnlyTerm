name: termwiz

on:
  pull_request:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/terminal/termwiz/**"
      - "crates/terminal/bidi/**"
      - "crates/configuration/onlyterm-dynamic/**"
      - "crates/terminal/color-types/**"
      - "crates/platform/filedescriptor/**"
      - "crates/terminal/vtparse/**"
      - "crates/terminal/api-crates/termwiz-funcs/**"
      - ".github/workflows/termwiz.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/terminal/termwiz/**"
      - "crates/terminal/bidi/**"
      - "crates/configuration/onlyterm-dynamic/**"
      - "crates/terminal/color-types/**"
      - "crates/platform/filedescriptor/**"
      - "crates/terminal/vtparse/**"
      - "crates/terminal/api-crates/termwiz-funcs/**"
      - ".github/workflows/termwiz.yml"

jobs:
  build-termwiz-all-features:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@stable
      - name: "Cache cargo"
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/terminal/termwiz
          key: "termwiz-${{ runner.os }}"
      - name: "Install cargo-nextest from Cargo"
        uses: baptiste0928/cargo-install@v3
        with:
          crate: "cargo-nextest"
      - name: Build
        run: |
          cargo build -p termwiz --all-features
          cargo nextest run --no-fail-fast --package termwiz --all-features
