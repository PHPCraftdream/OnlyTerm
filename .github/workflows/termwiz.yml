name: termwiz

on:
  pull_request:
    branches:
      - main
    paths:
      - "crates/termwiz/**"
      - "crates/bidi/**"
      - "crates/wezterm-dynamic/**"
      - "crates/color-types/**"
      - "crates/filedescriptor/**"
      - "crates/vtparse/**"
      - ".github/workflows/termwiz.yml"
  push:
    branches:
      - main
    paths:
      - "crates/termwiz/**"
      - "crates/bidi/**"
      - "crates/wezterm-dynamic/**"
      - "crates/color-types/**"
      - "crates/filedescriptor/**"
      - "crates/vtparse/**"
      - ".github/workflows/termwiz.yml"

jobs:
  build-termwiz-all-features:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@stable
      - name: "Cache cargo"
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/termwiz
          key: "termwiz-${{ runner.os }}"
      - name: "Install cargo-nextest from Cargo"
        uses: baptiste0928/cargo-install@v2
        with:
          crate: "cargo-nextest"
      - name: Build
        run: |
          source $HOME/.cargo/env
          cargo build -p termwiz --all-features
          cargo nextest run --no-fail-fast --package termwiz --all-features
