name: deny

on:
  pull_request:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/deny.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/deny.yml"
  schedule:
    # Weekly: advisories appear without any change to this repository.
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  bans-licenses-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: cargo deny (bans, licenses, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources
          arguments: --locked

  # Informational: a new advisory must not turn unrelated pull requests red.
  # Read the result in the run's log.
  advisories:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: cargo deny (advisories)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
          arguments: --locked
