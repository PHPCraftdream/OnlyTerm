name: windows_tag

on:
  push:
    tags:
      # Upstream uses date-based tags (20240203-...); this fork tags
      # releases as v0.0.N-alpha, so both patterns have to match or a
      # fork release never builds.
      - "20*"
      - "v*"

jobs:
  build:
    runs-on: "windows-2025"
    
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      RUSTUP_WINDOWS_PATH_ADD_BIN: "1"

    steps:
      - name: "checkout repo"
        uses: actions/checkout@v5
      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@stable
        with:
          target: "x86_64-pc-windows-msvc"
      - name: "Compile with sccache"
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: "Cache Rust Dependencies"
        uses: actions/cache@v4
        id: cache-cargo-vendor
        with:
          path: |
            vendor
            .cargo/config
          key: "cargo-deps-${{ hashFiles('**/Cargo.lock') }}"
      - name: "Vendor dependecies"
        if: steps.cache-cargo-vendor.outputs.cache-hit != 'true'
        shell: bash
        run: "cargo vendor --locked --versioned-dirs >> .cargo/config"
      - name: "Build wezterm (Release mode)"
        shell: cmd
        run: "cargo build -p wezterm --release"
      - name: "Build wezterm-gui (Release mode)"
        shell: cmd
        run: "cargo build -p wezterm-gui --release"
      - name: "Build wezterm-mux-server (Release mode)"
        shell: cmd
        run: "cargo build -p wezterm-mux-server --release"
      - name: "Build strip-ansi-escapes (Release mode)"
        shell: cmd
        run: "cargo build -p strip-ansi-escapes --release"
      - name: "Install cargo-nextest from Cargo"
        uses: baptiste0928/cargo-install@v3
        with:
          crate: "cargo-nextest"
          cache-key: "windows"
      - name: "Test"
        shell: cmd
        run: "cargo nextest run --all --no-fail-fast"
      - name: "Package"
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: "bash ci/deploy.sh"
      - name: "Upload artifact"
        uses: actions/upload-artifact@v7
        with:
          name: "windows"
          path: |
            OnlyTerm-*.zip
            OnlyTerm-*.exe

  upload:
    runs-on: ubuntu-latest
    needs: build
    if: github.repository == 'PHPCraftdream/OnlyTerm'
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: "checkout repo"
        uses: actions/checkout@v5
      - name: "Download artifact"
        uses: actions/download-artifact@v8
        with:
          name: "windows"
      - name: "Checksum"
        shell: bash
        run: "for f in OnlyTerm-*.zip OnlyTerm-*.exe ; do sha256sum $f > $f.sha256 ; done"
      - name: "Create pre-release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: "bash ci/retry.sh bash ci/create-release.sh ${{ github.ref_name }}"
      - name: "Upload to Tagged Release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: "bash ci/retry.sh gh release upload --clobber ${{ github.ref_name }} OnlyTerm-*.zip OnlyTerm-*.exe *.sha256"
