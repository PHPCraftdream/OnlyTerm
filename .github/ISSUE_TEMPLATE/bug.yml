name: Bug Report Form
description: Create a report to help us improve
labels: [bug, needs:triage]
assignees: []
body:
  - type: dropdown
    id: os
    attributes:
      label: What Windows version are you seeing this problem on?
      options:
        - Windows 10
        - Windows 11
    validations:
      required: true
  - type: input
    id: os_details
    attributes:
      label: Windows build details
      description: Please include the output from `systeminfo | findstr /B /C:"OS Name" /C:"OS Version"`
      placeholder: "ex: OS Name: Microsoft Windows 10 Pro  OS Version: 10.0.19045 N/A Build 19045"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OnlyTerm version
      description: |
        Please run `onlyterm -V` and include its output here.
      placeholder: "ex: 20240812-120000-abcd1234"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is
      placeholder: Tell us what happened
    validations:
      required: true
  - type: textarea
    id: to_repro
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        Please include as much information as possible that can help to reproduce and
        understand the issue.
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: |
        Please include the relevant section(s) of your `onlyterm.ktav` configuration file.
        You can enter "no config" if the issue happens without you having made a config file.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        If possible, activate the Debug Overlay by pressing CTRL-SHIFT-L and then copy
        and paste the log lines in here.
        You can also find log files in `%USERPROFILE%\.local\share\onlyterm\` (one file per PID).
      placeholder: |
        09:27:26.703 INFO onlyterm_gui::termwindow::webgpu::context > startup: GPU context fully built (shaders/buffers/samplers ready)
  - type: textarea
    id: other
    attributes:
      label: Anything else?
      description: |
        Add any other context about the problem here. You can attach screenshots by clicking
        this area to highlight it and then drag the files in, or just paste the image from
        the clipboard to upload it.
