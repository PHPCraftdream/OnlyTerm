[package]
name = "config"
version = "0.1.0"
authors = ["Wez Furlong <wez@wezfurlong.org>"]
edition = "2018"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dev-dependencies]
env_logger.workspace = true
tempfile.workspace = true

[features]
distro-defaults = []

[dependencies]
anyhow.workspace = true
bitflags.workspace = true
colorgrad.workspace = true
dirs-next.workspace = true
enum-display-derive.workspace = true
hostname.workspace = true
ktav.workspace = true
lazy_static.workspace = true
libc.workspace = true
log.workspace = true
notify.workspace = true
ordered-float = { workspace=true, features = ["serde"] }
portable-pty = { workspace=true, features = ["serde_support"]}
promise.workspace = true
# rhai bridge for the Lua->rhai config migration (see
# docs/plans/2026-07-23-lua-rhai-migration.md). L1 promoted this from a
# dev-dependency (L0 tooling only) to a real dependency: `config::rhai_value`
# is production code implementing the `rhai::Dynamic <-> wezterm_dynamic::Value`
# bridge that will back the rhai config engine landing in L2. mlua remains the
# production config-parsing dependency until L5.
rhai.workspace = true
serde = {workspace=true, features = ["rc", "derive"]}
serde_json.workspace = true
shlex.workspace = true
smol.workspace = true
termwiz = { workspace=true, features=["use_serde"] }
toml.workspace = true
umask.workspace = true
wezterm-bidi.workspace = true
wezterm-config-derive.workspace = true
wezterm-dynamic.workspace = true
wezterm-input-types.workspace = true
wezterm-term = { workspace = true, features=["use_serde"] }

[target."cfg(unix)".dependencies]
nix = {workspace=true, features=["resource"]}

[target."cfg(windows)".dependencies]
winapi = { workspace=true, features = ["winuser"]}
