[package]
name = "onlyterm-mux-server-impl"
version = "0.1.0"
authors = ["Wez Furlong <wez@wezfurlong.org>"]
edition = "2018"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow.workspace = true
async-io.workspace = true
onlyterm-codec.workspace = true
onlyterm-config.workspace = true
futures.workspace = true
log.workspace = true
onlyterm-mux.workspace = true
portable-pty = { workspace=true, features = ["serde_support"]}
onlyterm-promise.workspace = true
onlyterm-rangeset.workspace = true
smol.workspace = true
termwiz = { workspace=true, features=["use_serde"] }
url.workspace = true
onlyterm-client.workspace = true
onlyterm-term = { workspace=true, features=["use_serde"] }
onlyterm-uds.workspace = true

[dev-dependencies]
# Only needed so that test doubles can spell the `Pane::writer` return type
# (`parking_lot::MappedMutexGuard`).
parking_lot.workspace = true

[target."cfg(windows)".dependencies]
winapi = { workspace=true, features = [ "winuser" ]}
