[package]
name = "onlyterm-codec"
version = "0.1.0"
authors = ["Wez Furlong <wez@wezfurlong.org>"]
edition = "2018"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow.workspace = true
onlyterm-config.workspace = true
leb128.workspace = true
log.workspace = true
metrics.workspace = true
onlyterm-mux.workspace = true
portable-pty = { workspace = true, features = ["serde_support"]}
onlyterm-rangeset.workspace = true
serde = {workspace=true, features = ["rc", "derive"]}
smol.workspace = true
termwiz.workspace = true
thiserror.workspace = true
varbincode.workspace = true
onlyterm-term = { workspace=true, features=["use_serde"] }
flate2.workspace = true

[dev-dependencies]
onlyterm-base91.workspace = true
onlyterm-uds.workspace = true
