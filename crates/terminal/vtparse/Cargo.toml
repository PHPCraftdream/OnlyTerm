[package]
authors = ["Wez Furlong <wez@wezfurlong.org>"]
name = "vtparse"
version = "0.7.0"
edition = "2018"
repository = "https://github.com/wezterm/wezterm"
description = "Low level escape sequence parser"
license = "MIT"
documentation = "https://docs.rs/vtparse"
keywords = ["terminal", "escape", "ansi", "sequence", "parser"]
readme = "README.md"

[features]
default = ["std"]
alloc = []
std = []
# Marker for downstream feature forwarding; no_std mode otherwise follows !std.
no_std = []

[dependencies]
heapless = { workspace = true }
utf8parse.workspace = true

[dev-dependencies]
k9.workspace = true
