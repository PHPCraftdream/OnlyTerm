[package]
name = "procinfo"
version = "0.1.0"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = ["lua"]
lua = ["dep:onlyterm-dynamic"]

[dependencies]
libc.workspace = true
log.workspace = true
onlyterm-dynamic = { workspace=true, optional = true, features=["std"]}

[target."cfg(windows)".dependencies]
ntapi.workspace = true
winapi = { workspace=true, features = [
    "handleapi",
    # `activity_stamp` uses `FILETIME::default()`, which winapi only derives
    # under this feature. Without declaring it here the crate happens to
    # build inside the workspace (termwiz/onlyterm-escape-parser turn it on
    # and Cargo unifies features) but `cargo test -p procinfo` on its own
    # does not compile.
    "impl-default",
    "memoryapi",
    "psapi",
    "processthreadsapi",
    "realtimeapiset",
    "shellapi",
    "sysinfoapi",
    "synchapi",
    "tlhelp32",
    "winbase",
    "winerror",
]}
