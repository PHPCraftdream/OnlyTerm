[package]
name = "share-data"
version = "0.1.0"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow.workspace = true
config.workspace = true
lazy_static.workspace = true
ordered-float.workspace = true
wezterm-dynamic.workspace = true
# Promoted to a real dependency as of L4c (see
# docs/plans/2026-07-23-lua-rhai-migration.md): `src/lib.rs::register_rhai`
# registers a rhai-side equivalent of `wezterm.GLOBAL`, sharing the exact same
# `GLOBALS` singleton storage the mlua path (`register`) uses, via the
# `config::rhai_value` Dynamic<->Dynamic bridge.
rhai.workspace = true
