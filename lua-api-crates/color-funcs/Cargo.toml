[package]
name = "color-funcs"
version = "0.1.0"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow.workspace = true
config.workspace = true
csscolorparser = {workspace=true, features=["lab"]}
deltae.workspace = true
image.workspace = true
lazy_static.workspace = true
log.workspace = true
lru.workspace = true
luahelper.workspace = true
plist.workspace = true
serde = {workspace=true, features=["derive"]}
serde_json.workspace = true
serde_yaml.workspace = true
wezterm-dynamic.workspace = true
wezterm-color-types = {workspace=true, features=["std"]}
wezterm-term = { workspace=true, features=["use_serde"] }
# Promoted from a dev-dependency (L0 tooling, see
# docs/plans/2026-07-23-lua-rhai-migration.md) to a real dependency as of L4a:
# `src/lib.rs::register_rhai` now registers real rhai-side equivalents of every
# function in `register(lua: &Lua)`, in parallel with the mlua path.
rhai.workspace = true
