[package]
name = "color-funcs"
version = "0.1.0"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow.workspace = true
config.workspace = true
csscolorparser = {workspace=true, features=["lab"]}
deltae.workspace = true
image.workspace = true
lazy_static.workspace = true
log.workspace = true
lru.workspace = true
luahelper.workspace = true
plist.workspace = true
serde = {workspace=true, features=["derive"]}
serde_json.workspace = true
serde_yaml.workspace = true
wezterm-dynamic.workspace = true
wezterm-color-types = {workspace=true, features=["std"]}
wezterm-term = { workspace=true, features=["use_serde"] }

[dev-dependencies]
# L0 tooling for the Lua->rhai migration (see
# docs/plans/2026-07-23-lua-rhai-migration.md). Proves, as a sample for the future
# L4a-L4e per-crate ports, that a simple function with the same signature as an
# existing lua-api-crates function can be registered on a rhai::Engine and called
# from a .rhai script. Not a replacement for the lua registration in src/lib.rs.
rhai.workspace = true
