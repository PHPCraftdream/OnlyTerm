[package]
name = "spawn-funcs"
version = "0.1.0"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow.workspace = true
bstr.workspace = true
config.workspace = true
log.workspace = true
luahelper.workspace = true
smol.workspace = true
wezterm-dynamic.workspace = true
wezterm-open-url.workspace = true
# Promoted to a real dependency as of L4c (see
# docs/plans/2026-07-23-lua-rhai-migration.md): `src/lib.rs::register_rhai`
# registers rhai-side equivalents of every function in
# `register(lua: &Lua)`, in parallel with the mlua path.
rhai.workspace = true

[target."cfg(windows)".dependencies]
winapi = { workspace=true, features = ["winuser"]}
